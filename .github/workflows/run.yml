name: Download and Archive

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'Url'
        required: true
        type: string
      archive_password:
        description: 'Password'
        required: false
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install 7zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Mask sensitive values
        run: |
          echo "::add-mask::${{ github.event.inputs.download_url }}"
          echo "::add-mask::${{ github.event.inputs.archive_password }}"

      - name: Run downloader
        run: |
          node downloader.js "${{ github.event.inputs.download_url }}" "${{ github.event.inputs.archive_password }}"

      - name: Commit and Push files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add *.7z*
          git commit -m "Add downloaded archive parts"
          git push
